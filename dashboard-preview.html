<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Preview</title>
<script>
  (function () {
    var dark = false;
    try { dark = localStorage.getItem('dashboard-theme') === 'dark'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard-preview.css">
<script src="js/dashboard-preview.js" defer></script>
</head>
<body>

<div class="dp-frame" id="dp-frame">

  <div class="dp-sidebar">
    <div class="dp-brand">
      <span class="dp-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M4 4h7v7H4V4zm9 0h7v4h-7V4zm0 7h7v9h-7v-9zM4 14h7v6H4v-6z"/></svg>
      </span>
      <span class="dp-brand-name">Personal Dashboard</span>
    </div>

    <div class="dp-menu">
      <h2 class="dp-group-title">Menu</h2>
      <nav class="dp-nav" aria-label="Main">
        <ul>
          <li>
            <a href="index.html" aria-current="page">
              <svg viewBox="0 0 24 24" fill="currentColor" width="19" height="19" aria-hidden="true"><path d="M4 4h7v7H4V4zm9 0h7v4h-7V4zm0 7h7v9h-7v-9zM4 14h7v6H4v-6z"/></svg>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="index.html">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke="currentColor" width="19" height="19" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path stroke-linecap="round" d="M3 10h18"/><circle cx="16" cy="14.5" r="1.4" fill="currentColor" stroke="none"/></svg>
              <span>Finances</span>
            </a>
          </li>
          <li>
            <a href="index.html">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke="currentColor" width="19" height="19" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path stroke-linecap="round" d="M8 3v4M16 3v4M3 10h18"/></svg>
              <span>Calendar</span>
            </a>
          </li>
          <li>
            <a href="index.html">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke="currentColor" width="19" height="19" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5.5A2.5 2.5 0 016.5 3H12v18H6.5A2.5 2.5 0 014 18.5v-13zM20 5.5A2.5 2.5 0 0017.5 3H12v18h5.5a2.5 2.5 0 002.5-2.5v-13z"/></svg>
              <span>Study</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <section class="dp-events" aria-labelledby="dp-events-title">
      <h2 class="dp-group-title" id="dp-events-title">Upcoming events</h2>
      <ul id="dp-events-list"></ul>
    </section>

    <div class="dp-user">
      <span class="dp-avatar dp-avatar-sm" aria-hidden="true" id="dp-user-initial"></span>
      <span class="dp-user-name" id="dp-user-name"></span>
      <button type="button" class="dp-user-btn" aria-label="Account menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
  </div>

  <main class="dp-main">

    <header class="dp-top">
      <span class="dp-avatar" aria-hidden="true" id="dp-top-initial"></span>
      <h1 class="dp-greeting" id="dp-greeting">Hello</h1>
      <div class="dp-controls">
        <div class="dp-select">
          <select aria-label="Range" id="dp-range">
            <option value="14">Last 14 days</option>
            <option value="7">Last 7 days</option>
          </select>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <button type="button" class="dp-icon-btn dp-icon-btn-primary" aria-label="Add transaction">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" class="dp-icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke="currentColor" width="18" height="18" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path stroke-linecap="round" d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        </button>
        <button type="button" class="dp-icon-btn" id="dp-theme" aria-label="Toggle dark mode"></button>
      </div>
    </header>

    <section class="dp-card dp-chart" aria-labelledby="dp-chart-title">
      <div class="dp-card-head">
        <h2 id="dp-chart-title">Spending overview</h2>
        <ul class="dp-legend">
          <li><span class="dp-swatch dp-swatch-in" aria-hidden="true"></span>Income</li>
          <li><span class="dp-swatch dp-swatch-out" aria-hidden="true"></span>Expense</li>
        </ul>
      </div>
      <div class="dp-chart-scroll" id="dp-chart-scroll" tabindex="0" role="region" aria-label="Spending chart, scrolls sideways on narrow screens">
        <div id="dp-chart"></div>
      </div>
      <div id="dp-chart-table"></div>
    </section>

    <div class="dp-stats" id="dp-stats"></div>

    <aside class="dp-side" aria-label="Budgets and subscriptions">
      <section class="dp-card" aria-labelledby="dp-budgets-title">
        <h2 id="dp-budgets-title">Budgets</h2>
        <ul class="dp-rows" id="dp-budgets"></ul>
      </section>
      <section class="dp-card" aria-labelledby="dp-subs-title">
        <h2 id="dp-subs-title">Subscriptions</h2>
        <ul class="dp-rows" id="dp-subs"></ul>
      </section>
    </aside>

  </main>
</div>

</body>
</html>
